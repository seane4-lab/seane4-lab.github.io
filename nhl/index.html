<title>NHL Goal Odds</title>

<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --muted:#5b6575; --line:#e3e6eb;
  --accent:#0b5fff; --good:#0f8a4b; --bar:#0b5fff; --bar-bg:#e9edf3; --head:#f0f2f6;
  --chip:#eef1f5; --pp1:#d8f3e3; --pp1-ink:#0b5c33; --pp2:#fff0cf; --pp2-ink:#7a5200;
  --shadow:0 1px 2px rgba(20,24,31,.06),0 4px 14px rgba(20,24,31,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --card:#161b24; --ink:#e8ebf1; --muted:#98a2b3; --line:#262d3a;
    --accent:#6ea0ff; --good:#4cc38a; --bar:#6ea0ff; --bar-bg:#232b39; --head:#1b212c;
    --chip:#1f2633; --pp1:#14352a; --pp1-ink:#7be0ad; --pp2:#3a2f12; --pp2-ink:#f2c76b; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --card:#161b24; --ink:#e8ebf1; --muted:#98a2b3; --line:#262d3a;
  --accent:#6ea0ff; --good:#4cc38a; --bar:#6ea0ff; --bar-bg:#232b39; --head:#1b212c;
  --chip:#1f2633; --pp1:#14352a; --pp1-ink:#7be0ad; --pp2:#3a2f12; --pp2-ink:#f2c76b; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.35rem;line-height:1.15;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem}
.stamp{font-size:.82rem;color:var(--muted)}
.stamp b{color:var(--ink);font-weight:600}
.banner{background:var(--pp2);color:var(--pp2-ink);border-radius:8px;padding:6px 10px;font-size:.84rem;margin-bottom:10px;display:none}

section{margin-top:12px}
section h2{font-size:.95rem;margin:0 0 5px;display:flex;gap:8px;align-items:baseline}
section h2 small{font-weight:400;color:var(--muted);font-size:.78rem}
.table{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.r{display:grid;align-items:center;gap:0 10px;padding:0 10px;min-height:34px;border-top:1px solid var(--line);
   grid-template-columns:22px minmax(235px,1.6fr) 82px 46px minmax(170px,1.2fr) 58px 32px 30px minmax(112px,1fr)}
.r.h{background:var(--head);border-top:0;min-height:30px;padding-top:3px;padding-bottom:3px;line-height:1.15;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.r.scored{box-shadow:inset 3px 0 0 var(--good)}
.rank{color:var(--muted);text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.who{min-width:0;display:flex;gap:6px;align-items:center;white-space:nowrap}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;min-width:0}
.game{color:var(--muted);font-size:.8rem;white-space:nowrap}
.chip{flex:none}
.logo{width:20px;height:20px;object-fit:contain;flex:none}
.badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;flex:none;
  font-size:.52rem;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
.mob-sub .badge{width:14px;height:14px;font-size:.4rem}
.tag{color:var(--muted);font-size:.72rem;opacity:.9;margin-left:2px}
.tag.conf{color:var(--good);font-weight:600;opacity:1}
.gl{display:flex;gap:7px;align-items:center;min-width:0;font-size:.86rem}
.gl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yes{color:var(--good);font-weight:700;text-align:center;font-size:.86rem}
.no{color:var(--muted);text-align:center;opacity:.5}
.goalie{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;font-size:.86rem}
.dim{color:var(--muted)}
.fin{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.fin b{font-size:1rem;font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.track{flex:1;height:5px;border-radius:99px;background:var(--bar-bg);overflow:hidden;min-width:30px}
.bar{height:100%;background:var(--bar);border-radius:99px}
.odds{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem}
.chip{border-radius:999px;padding:0 6px;font-size:.68rem;font-weight:700;line-height:1.5;background:var(--chip);color:var(--muted)}
.chip.pp1{background:var(--pp1);color:var(--pp1-ink)} .chip.pp2{background:var(--pp2);color:var(--pp2-ink)}
.chip.ok{background:var(--pp1);color:var(--pp1-ink)}
.empty{padding:14px 10px;color:var(--muted);font-size:.88rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mob-sub{display:none;gap:5px;align-items:center;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-sub .logo{width:14px;height:14px}
.short{display:none}
.who-col{min-width:0}
@media (max-width:760px){
  .r{grid-template-columns:20px minmax(0,1fr) 40px 58px;gap:0 6px;padding:4px 10px}
  .r > .goalie,.r > .game,.r > .xga,.r > .gp,.r > .gg,.r .track{display:none}
  .chip.line{display:none}
  .fin{justify-content:flex-end}
  .fin b{min-width:0}
  .mob-sub{display:flex}
  .full{display:none}
  .short{display:inline}
  /* give the name the room: smaller logo/chips/columns, tighter gaps */
  .r{grid-template-columns:16px minmax(0,1fr) 30px 50px;gap:0 5px;padding:4px 8px}
  .who{gap:2px 4px;flex-wrap:wrap}
  .who .logo{width:16px;height:16px}
  .chip{padding:0 4px;font-size:.6rem}
  .name{font-size:.88rem;flex:0 0 auto;max-width:calc(100% - 20px)}
  .rank{font-size:.72rem}
  .yes{font-size:.74rem}
  .fin b{font-size:.92rem}
}
</style>

// ---- CSV ------------------------------------------------------------------
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=='\r') cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function toPlayers(text){
  const rows=parseCSV(text).filter(r=>r.length>1||r[0]);
  if(rows.length<1) return {players:[],updated:""};
  const head=rows[0]; let updated="";
  const last=head[head.length-1]||"";
  if(/^Updated:/i.test(last)) updated=last.replace(/^Updated:\s*/i,"");
  const idx={}; head.forEach((h,i)=>{ if(h && !/^Updated:/i.test(h)) idx[h]=i; });
  const pct=s=>{const n=parseFloat(String(s).replace('%',''));return isNaN(n)?null:n;};
  const players=rows.slice(1).filter(r=>r[idx["Player"]]).map(r=>({
    name:r[idx["Player"]], team:r[idx["Team"]], opp:r[idx["Opp"]], ha:r[idx["H/A"]],
    line:r[idx["Line"]], pp:r[idx["PP unit"]],
    goalie:r[idx["Opp goalie"]], gaa:r[idx["Goalie GAA used"]], gp:r[idx["GP"]], g:r[idx["G"]],
    base:pct(r[idx["Base chance (blend)"]]), afterG:pct(r[idx["After goalie + home/away"]]),
    z:r[idx["Shot quality z"]], afterQ:pct(r[idx["After shot quality"]]),
    final:pct(r[idx["Final P(goal)"]]), odds:r[idx["Odds (American)"]],
    scored:(r[idx["Scored today"]]||"").toLowerCase()==="yes"
  })).filter(p=>p.final!==null);
  players.sort((a,b)=>b.final-a.final);
  return {players,updated};
}

  const tryNext=k=>{
    if(k>=srcs.length) return;
    const img=new Image(); img.className=cls||"logo"; img.alt=""; img.referrerPolicy="no-referrer";
    img.onload=()=>{ wrap.textContent=""; wrap.append(img); };
    img.onerror=()=>tryNext(k+1);
    img.src=srcs[k];
  };
  tryNext(0);
  return wrap;
}
const num=v=>(v===""||v==null)?"–":v;

function render(){
  const root=$("#groups"); root.textContent="";
  [1,2,3].forEach(g=>{
    const players=DATA[g].players;
    const max=Math.max(...players.map(p=>p.final),1);
    const table=el("div",{class:"table"});
    table.append(el("div",{class:"r h"},
      cell("",""),cell("","Player"),cell("game","Game"),cell("","Home"),cell("goalie","Goalie Faced"),
      cell("n xga","Opp. xGA"),cell("n gp","GP"),cell("n gg","G"),
      el("div",{class:"n"},el("span",{class:"full",text:"Scoring Probability"}),el("span",{class:"short",text:"Prob."}))));
    if(!players.length) table.append(el("div",{class:"empty",text:"No players listed right now."}));
    players.forEach((p,i)=>{
      const chips=[];
      if(p.pp) chips.push(el("span",{class:"chip "+(p.pp==="PP1"?"pp1":"pp2"),text:p.pp}));
      if(p.line) chips.push(el("span",{class:"chip line",text:p.line}));
      if(p.scored) chips.push(el("span",{class:"chip ok",text:"Scored"}));
      const bar=el("div",{class:"bar"}); bar.style.width=(p.final/max*100)+"%";
      const gn=goalieName(p.goalie), gt=goalieTag(p.goalie);
      const home=p.ha==="Home";
      table.append(el("div",{class:"r"+(p.scored?" scored":"")},
        cell("rank",String(i+1)),
        el("div",{class:"who-col"},
          el("div",{class:"who"},logo(p.team),el("span",{class:"name"},el("span",{class:"full",text:p.name}),el("span",{class:"short",text:shortName(p.name)})),...chips),
          el("div",{class:"mob-sub"},p.team+" "+(home?"vs":"@")+" "+p.opp+" · ",logo(p.opp),shortName(gn)+(gt&&!/probable/i.test(gt)?" ("+gt+")":""))),
        cell("game",p.team+" "+(home?"vs":"@")+" "+p.opp),
        home?cell("yes","Yes"):cell("no","–"),
        el("div",{class:"gl goalie",title:p.goalie},logo(p.opp),
          el("span",{},gn,gt?el("span",{class:"tag"+(/confirmed/i.test(gt)?" conf":""),text:" "+gt}):null)),
        cell("n xga",p.gaa?parseFloat(p.gaa).toFixed(2):"–"),
        cell("n gp",num(p.gp)),cell("n gg",num(p.g)),
        el("div",{class:"fin"},el("div",{class:"track"},bar),el("b",{text:f1(p.final)}))));
    });
    root.append(el("section",{},
      el("h2",{},GROUP_NAMES[g],el("small",{text:players.length+" players"})),table));
  });
}

function renderStamp(){
  const u=DATA[1].updated||DATA[2].updated||DATA[3].updated;
  $("#stamp").textContent="";
  if(u) $("#stamp").append("Updated ",el("b",{text:u})," (Alberta time)");
  const b=$("#banner");
  if(usingSnapshot){ b.style.display="block"; b.textContent="Showing a saved snapshot, not live data."; }
  else b.style.display="none";
}

function setData(map,live){
  [1,2,3].forEach(g=>{ DATA[g]=toPlayers(map[g]||""); });
  usingSnapshot=!live; render(); renderStamp();
}

async function load(){
  const urls=Object.values(SHEET_CSV);
  if(!urls.every(Boolean)){ setData(SNAPSHOT,false); return; }
  try{
    const out={};
    await Promise.all([1,2,3].map(async g=>{
      const sep=SHEET_CSV[g].includes("?")?"&":"?";
      const r=await fetch(SHEET_CSV[g]+sep+"t="+Date.now());
      if(!r.ok) throw new Error("HTTP "+r.status);
      out[g]=await r.text();
    }));
    setData(out,true);
  }catch(e){
    if(usingSnapshot||!DATA[1].players.length) setData(SNAPSHOT,false);
    else renderStamp();
  }
}
load();
if(Object.values(SHEET_CSV).every(Boolean)) setInterval(load,REFRESH_MS);
</script>
</body>
</html>
