name: Pull picks

on:
  schedule:
    # Times are UTC. Alberta is UTC-6 all year, so 14:45 UTC = 8:45 AM.
    # 25 runs per day, every 30 minutes, 8:45 AM to 8:45 PM Alberta time.
    - cron: "45 14 * * *"          # 8:45 AM
    - cron: "15,45 15-23 * * *"    # 9:15 AM to 5:45 PM
    - cron: "15,45 0-2 * * *"      # 6:15 PM to 8:45 PM
  workflow_dispatch:   # lets you press "Run workflow" by hand

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write the Google key to a temporary file
        run: printf '%s' "$GCP_KEY_JSON" > "$RUNNER_TEMP/key.json"
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_KEY_JSON }}

      # Cheap check: once today's pool has closed, the slow steps below are skipped.
      - name: Check whether today's pool has closed
        id: gate
        run: python nst_timhortons_picks_gsheets_v4.py --gate
        env:
          SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/key.json
          GOOGLE_SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Remember the downloaded browser between runs
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the browser
        if: steps.gate.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: Capture picks and write to the sheet
        if: steps.gate.outputs.skip != 'true'
        run: python nst_timhortons_picks_gsheets_v4.py
        env:
          SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/key.json
          GOOGLE_SHEET_ID: ${{ secrets.SHEET_ID }}
          ARTIFACT_DIR: ${{ runner.temp }}

      - name: Capture goalie starters and write to the sheet
        if: ${{ !cancelled() && steps.gate.outputs.skip != 'true' }}
        run: python goaliepost_starters.py
        env:
          SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/key.json
          GOOGLE_SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: ${{ runner.temp }}/thpicks_failed.png
          if-no-files-found: ignore
